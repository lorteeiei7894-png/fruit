<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทายผลไม้จากภาพ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f6f8;
    --surface: #ffffff;
    --ink: #1b2a33;
    --muted: #5d6e78;
    --line: #d5dee3;
    --apple: #d7263d;
    --banana: #e8b400;
    --orange: #f28c28;
    --mixed: #6c5b9e;
    --other: #5d6e78;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Prompt", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 2rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }

  .panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 640px) { .panel { grid-template-columns: 1fr; } }

  .drop {
    position: relative;
    min-height: 280px;
    border: 2px dashed var(--line);
    border-radius: 12px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
    cursor: pointer;
    overflow: hidden;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop:focus-visible, .drop.over { border-color: var(--ink); background: #fbfdfe; outline: none; }
  .drop img { max-width: 100%; max-height: 300px; border-radius: 8px; display: none; }
  .drop.has-image img { display: block; }
  .drop.has-image .hint { display: none; }
  .hint strong { display: block; font-size: 1.1rem; }
  .hint span { color: var(--muted); font-size: .9rem; }
  input[type=file] { display: none; }

  .result {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    min-height: 280px;
  }
  .verdict { font-size: 1.6rem; font-weight: 700; margin: 0 0 16px; }
  .status { color: var(--muted); margin: 0; }
  .row { margin-bottom: 12px; }
  .row-head { display: flex; justify-content: space-between; font-size: .95rem; margin-bottom: 4px; }
  .track { height: 10px; background: #e6edf0; border-radius: 5px; overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 5px; transition: width .35s ease; }

  .actions { margin-top: 16px; display: flex; gap: 10px; }
  button {
    font: inherit;
    border: 0;
    border-radius: 8px;
    padding: 10px 18px;
    background: var(--ink);
    color: #fff;
    cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:focus-visible { outline: 3px solid #7aa7ff; outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
</style>
</head>
<body>
<main>
  <h1>ทายผลไม้จากภาพ</h1>
  <p class="sub">อัปโหลดรูป แล้วระบบจะบอกว่าเป็นแอปเปิล กล้วย ส้ม หรือผลไม้ปนกัน</p>

  <div class="panel">
    <label class="drop" id="drop" tabindex="0">
      <img id="preview" alt="รูปที่อัปโหลด">
      <div class="hint">
        <strong>เลือกรูปภาพ</strong>
        <span>คลิก หรือลากรูปมาวางที่นี่</span>
      </div>
      <input type="file" id="file" accept="image/*">
    </label>

    <section class="result" aria-live="polite">
      <p class="status" id="status">กำลังโหลดโมเดล...</p>
      <div id="output"></div>
    </section>
  </div>

  <div class="actions">
    <button type="button" id="clear" class="ghost" disabled>ล้างรูป</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.4/dist/teachablemachine-image.min.js"></script>
<script>
  // ลิงก์โมเดลจาก Teachable Machine
  const MODEL_URL = "https://teachablemachine.withgoogle.com/models/quSzON_gn/";

  // ชื่อคลาสในโมเดล -> ชื่อที่แสดง และสี (ปรับชื่อให้ตรงกับคลาสของคุณได้)
  const LABELS = {
    apple:  { th: "แอปเปิล",  emoji: "🍎", color: "var(--apple)" },
    banana: { th: "กล้วย",    emoji: "🍌", color: "var(--banana)" },
    orange: { th: "ส้ม",      emoji: "🍊", color: "var(--orange)" },
    mixed:  { th: "ผลไม้ปนกัน", emoji: "🧺", color: "var(--mixed)" }
  };

  let model = null;
  const drop = document.getElementById("drop");
  const fileInput = document.getElementById("file");
  const preview = document.getElementById("preview");
  const statusEl = document.getElementById("status");
  const output = document.getElementById("output");
  const clearBtn = document.getElementById("clear");

  function info(className) {
    return LABELS[className.trim().toLowerCase()] ||
           { th: className, emoji: "", color: "var(--other)" };
  }

  async function loadModel() {
    try {
      model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
      statusEl.textContent = "พร้อมแล้ว เลือกรูปเพื่อเริ่มทาย";
    } catch (err) {
      console.error(err);
      statusEl.textContent = "โหลดโมเดลไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้านี้";
    }
  }

  function handleFile(file) {
    if (!file || !file.type.startsWith("image/")) {
      statusEl.textContent = "ไฟล์นี้ไม่ใช่รูปภาพ เลือกไฟล์ .jpg .png หรือ .webp";
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      preview.onload = predict;
      preview.src = e.target.result;
      drop.classList.add("has-image");
      clearBtn.disabled = false;
    };
    reader.readAsDataURL(file);
  }

  async function predict() {
    if (!model) {
      statusEl.textContent = "โมเดลยังโหลดไม่เสร็จ รอสักครู่แล้วลองอีกครั้ง";
      return;
    }
    statusEl.textContent = "กำลังวิเคราะห์...";
    const results = await model.predict(preview);
    results.sort((a, b) => b.probability - a.probability);

    const top = info(results[0].className);
    statusEl.textContent = "";
    output.innerHTML = "";

    const verdict = document.createElement("p");
    verdict.className = "verdict";
    verdict.textContent = `${top.emoji} ${top.th}`.trim();
    output.appendChild(verdict);

    results.forEach(r => {
      const meta = info(r.className);
      const pct = (r.probability * 100).toFixed(1);
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML =
        `<div class="row-head"><span></span><span>${pct}%</span></div>` +
        `<div class="track"><div class="fill"></div></div>`;
      row.querySelector("span").textContent = `${meta.emoji} ${meta.th}`.trim();
      const fill = row.querySelector(".fill");
      fill.style.background = meta.color;
      output.appendChild(row);
      requestAnimationFrame(() => { fill.style.width = pct + "%"; });
    });
  }

  function reset() {
    preview.removeAttribute("src");
    drop.classList.remove("has-image");
    output.innerHTML = "";
    fileInput.value = "";
    clearBtn.disabled = true;
    statusEl.textContent = model ? "พร้อมแล้ว เลือกรูปเพื่อเริ่มทาย" : "กำลังโหลดโมเดล...";
  }

  fileInput.addEventListener("change", () => handleFile(fileInput.files[0]));
  clearBtn.addEventListener("click", reset);
  drop.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); }
  });
  ["dragenter", "dragover"].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => handleFile(e.dataTransfer.files[0]));

  loadModel();
</script>
</body>
</html>
